# LUM — app definitions. Documentation: doc/configuration.md
# Secrets are never written here: use ${VARIABLE} (environment or .env file).
apps:
  # Sonarr updates itself through its own API (update.type: api).
  - id: sonarr
    name: "Sonarr"
    lxc_id: 101
    agent: sonarr-lxc
    upstream:
      type: github
      repo: "Sonarr/Sonarr"
      include_prerelease: false
      tag_regex: "^v?(?P<version>\\d+\\.\\d+\\.\\d+(\\.\\d+)?)$"
    current:
      type: api
      url: "http://192.0.2.15:8989/api/v3/system/status"
      auth_header: "X-Api-Key"
      token: "${SONARR_API_KEY}"
      json_path: "$.version"
    update:
      type: api
      method: POST
      url: "http://192.0.2.15:8989/api/v3/command"
      auth_header: "X-Api-Key"
      token: "${SONARR_API_KEY}"
      body: '{"name": "ApplicationUpdate"}'
    healthcheck:
      url: "http://192.0.2.15:8989/ping"
      expect_status: 200
      timeout: 120s
    snapshot_before_update: true

  # Vaultwarden is updated by a script run by the agent inside the LXC
  # (update.type: script), and its version is read by the agent too.
  - id: vaultwarden
    name: "Vaultwarden"
    lxc_id: 102
    agent: vaultwarden-lxc
    upstream:
      type: github
      repo: "dani-garcia/vaultwarden"
      tag_regex: "^(?P<version>\\d+\\.\\d+\\.\\d+)$"
    current:
      type: agent
      command: ["/opt/vaultwarden/bin/vaultwarden", "--version"]
      output_regex: "(?P<version>\\d+\\.\\d+\\.\\d+)"
    update:
      type: script
      script: "vaultwarden.sh"   # deploy/scripts/vaultwarden.sh, copied to scripts.dir
      timeout: 60m               # the community script rebuilds Vaultwarden from source
      # Optional: raise the LXC's CPU and memory for the duration of the update only,
      # then restore them (needs the proxmox section and the VM.Config.CPU and
      # VM.Config.Memory privileges). Values lower than the current ones are ignored.
      resources:
        cores: 4                 # CPU cores during the update
        memory: 4096             # memory in MiB during the update
    healthcheck:
      url: "http://192.0.2.21:8000/alive"
      expect_status: 200
      timeout: 120s
    snapshot_before_update: true
